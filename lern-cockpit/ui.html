<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lern-Cockpit – Planeten &amp; Erdbeben</title>
<link rel="icon" href="ui/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui/fonts.css">
<style>
  /* Colours and type of 1-heart.eu ("Sunny Side Up"): parchment, plum, amber, burgundy, green, sea.
     Light = the site's own palette; dark = a night version of it. Fonts: ui/fonts.css. */
  :root {
    --parchment: #fdf3c7; --plum: #6b3a6e; --amber: #e2a123; --burgundy: #800020; --green: #2f6b3f; --sea: #2e7185;

    --bg: #fdf3c7; --card: #fef8dd; --nav: #faebb4; --text: #6b3a6e; --muted: #7a5a76; --line: #e2a12366;
    --heading: #6b3a6e; --heading-em: #800020; --eyebrow: #2f6b3f;
    --accent: #e2a123; --accent-strong: #c98a12; --accent-ink: #8a5d06; --accent-text: #800020; --accent-soft: #e2a1232b; --link: #800020;
    --ok: #2f6b3f; --warn: #9a6a0b; --err: #800020;
    --ok-bg: #2f6b3f17; --warn-bg: #e2a12326; --err-bg: #80002012; --code: #f9e8ae; --input: #fef8dd;
    --selection: #e2a12355; --line-number: #a5859f;
    --glow-1: #e2a12312; --glow-2: #e2a12319;
    --term-bg: #f9e8ae; --term-text: #4f2a52; --term-muted: #9a7d95; --term-line: #e2a12366;
    --term-prompt: #800020; --term-cmd: #6b3a6e; --term-info: #2e7185;
    --ansi-30: #4f2a52; --ansi-31: #800020; --ansi-32: #2f6b3f; --ansi-33: #9a6a0b; --ansi-34: #2e7185; --ansi-35: #6b3a6e; --ansi-36: #2e7185; --ansi-37: #8a6a86;
    --ansi-90: #9a7d95; --ansi-91: #a3203f; --ansi-92: #3f8a52; --ansi-93: #b37f12; --ansi-94: #3a8aa1; --ansi-95: #8b4f8f; --ansi-96: #3a8aa1; --ansi-97: #4f2a52;
    /* code */
    --t-text: #5a3060; --t-kw: #800020; --t-lit: #2e7185; --t-str: #2f6b3f; --t-num: #2e7185; --t-com: #7d5f3a;
    --t-title: #4f2a52; --t-bi: #835806; --t-var: #8b4f8f; --t-subst: #2e7185; --t-type: #835806; --t-attr: #800020;
    --code-inline: #800020; --code-inline-bg: #e2a1232e;

    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: Lato, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #241626; --card: #2e1d30; --nav: #1d111e; --text: #f3e6c4; --muted: #c4ad9a; --line: #e2a12340;
      --heading: #fdf3c7; --heading-em: #f2a7b8; --eyebrow: #8cc79a;
      --accent: #e2a123; --accent-strong: #f0b94a; --accent-ink: #f0b94a; --accent-text: #3d0815; --accent-soft: #e2a12329; --link: #f0b94a;
      --ok: #8cc79a; --warn: #f0b94a; --err: #f2a7b8;
      --ok-bg: #8cc79a1c; --warn-bg: #e2a12324; --err-bg: #f2a7b81c; --code: #1d111e; --input: #241626;
      --selection: #e2a12347; --line-number: #7d6478;
      --glow-1: #e2a1230d; --glow-2: #e2a12312;
      --term-bg: #1a0f1b; --term-text: #f3e6c4; --term-muted: #8f7a8a; --term-line: #e2a12333;
      --term-prompt: #f0b94a; --term-cmd: #fdf3c7; --term-info: #7fc4d6;
      --ansi-30: #4a3348; --ansi-31: #f2a7b8; --ansi-32: #8cc79a; --ansi-33: #f0b94a; --ansi-34: #7fc4d6; --ansi-35: #d3a6d6; --ansi-36: #7fc4d6; --ansi-37: #e6d6b4;
      --ansi-90: #8f7a8a; --ansi-91: #f7c1cd; --ansi-92: #aedbb8; --ansi-93: #f6d07f; --ansi-94: #a6d8e6; --ansi-95: #e3c3e5; --ansi-96: #a6d8e6; --ansi-97: #fdf3c7;
      --t-text: #f3e6c4; --t-kw: #f2a7b8; --t-lit: #7fc4d6; --t-str: #8cc79a; --t-num: #7fc4d6; --t-com: #a68ba3;
      --t-title: #fdf3c7; --t-bi: #f0b94a; --t-var: #d3a6d6; --t-subst: #7fc4d6; --t-type: #f0b94a; --t-attr: #f2a7b8;
      --code-inline: #f6d07f; --code-inline-bg: #e2a12324;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font: 300 15px/1.7 var(--sans); overflow: hidden;
    background: radial-gradient(ellipse at 10% 30%, var(--glow-1), transparent 50%),
                radial-gradient(ellipse at 90% 60%, var(--glow-2), transparent 60%), var(--bg);
  }
  b, strong { font-weight: 700; }
  h1, h2, h3, .doc h4 { font-family: var(--serif); font-weight: 500; color: var(--heading); letter-spacing: .005em; }
  h1, h2, h3, nav, .tabs, button.primary { font-variant-numeric: lining-nums; } /* "01", not old-style figures "oı" */
  h1 em, h2 em, h3 em { color: var(--heading-em); }
  ::selection { background: var(--selection); }
  button { font: 400 14px/1.4 var(--sans); border-radius: 999px; padding: 6px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); transition: border-color .2s, background .2s; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font: 600 17px/1.3 var(--serif); padding: 7px 22px; }
  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  button:disabled { opacity: .5; cursor: default; }
  code, pre, textarea, .term { font-family: var(--mono); }

  .app { display: grid; grid-template-columns: 270px 1fr; grid-template-rows: 58px 1fr; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 24px; margin: 0; white-space: nowrap; font-weight: 600; line-height: 1; }
  header .logo { width: 40px; height: 40px; flex: none; margin-right: -6px; }
  header h1 span { color: var(--heading-em); font-weight: 500; font-style: italic; font-size: 19px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 14px; font-size: 13px; letter-spacing: .08em; font-weight: 700; background: transparent; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .spacer { flex: 1; }
  .where { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 10px 24px; background: var(--nav); }
  nav .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; border-radius: 10px; background: transparent; padding: 6px 10px; font: 500 17.5px/1.3 var(--serif); color: var(--text); }
  nav .item:hover { background: var(--accent-soft); }
  nav .item.on { background: var(--accent-soft); color: var(--heading-em); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
  nav .item.dim { opacity: .55; }
  nav .num { font: 700 11px/1 var(--sans); letter-spacing: .06em; color: var(--accent-ink); width: 20px; flex: none; }
  nav .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav .sep { height: 1px; background: var(--line); margin: 8px 6px; }
  .badge { font: 700 11px/1.4 var(--sans); padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.part { background: var(--warn-bg); color: var(--warn); }
  .badge.err { background: var(--err-bg); color: var(--err); }

  .main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .unit-head { display: flex; align-items: center; gap: 14px; padding: 12px 22px 0; flex-wrap: wrap; }
  .unit-head h2 { font-size: 28px; margin: 0; line-height: 1.1; }
  .unit-head .meta { color: var(--eyebrow); font: 700 11px/1.4 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 6px 12px; font: 500 17px/1.3 var(--serif); color: var(--muted); white-space: nowrap; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--heading-em); border-bottom-color: var(--accent); font-weight: 600; }
  .tabs button .dot { color: var(--accent-ink); }
  .content { flex: 1; overflow: auto; min-height: 0; }

  .doc { max-width: 860px; padding: 20px 30px 56px; }
  .doc h1 { font-size: 38px; line-height: 1.15; margin: 8px 0 18px; }
  .doc h2 { font-size: 29px; line-height: 1.2; margin: 34px 0 12px; }
  .doc h3 { font-size: 22px; margin: 24px 0 8px; }
  .doc a { color: var(--link); font-weight: 400; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
  .doc a:hover { text-decoration-thickness: 2px; }
  .doc strong { color: var(--heading); }
  /* code */
  .doc code { color: var(--code-inline); background: var(--code-inline-bg); padding: 1px 4px; border-radius: 4px; font-size: .9em; }
  .doc a code { color: var(--link); }
  .doc pre { background: var(--code); border: 1px solid var(--line); padding: 16px 18px; border-radius: 12px; overflow-x: auto; font-size: 13.5px; line-height: 1.55; tab-size: 4; }
  .doc pre code { color: var(--t-text); background: none; padding: 0; font-size: 1em; }
  .doc table { border-collapse: collapse; margin: 12px 0; font-size: 14.5px; display: block; overflow-x: auto; }
  .doc th, .doc td { border-bottom: 1px solid var(--line); padding: 7px 12px; text-align: left; vertical-align: top; }
  .doc th { font: 700 11px/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--eyebrow); border-bottom-color: var(--accent); }
  .doc blockquote { margin: 14px 0; padding: 8px 18px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 12px 12px 0; }
  .doc blockquote p { margin: 6px 0; }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
  .doc li { margin: 4px 0; }
  .doc li::marker { color: var(--accent-ink); }
  .note { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin: 0 0 20px; font-size: 14.5px; }
  .note.warn { background: var(--err-bg); }
  .note p { margin: 4px 0; }

  .editor-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .editor-bar .name { font-family: var(--mono); font-size: 13px; }
  .editor-bar .state { font: 700 11px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--eyebrow); }
  .editor-bar .state.dirty { color: var(--accent-ink); }
  .editor { display: flex; height: calc(100% - 49px); min-height: 0; }
  .gutter { padding: 10px 8px 10px 12px; text-align: right; color: var(--line-number); font-size: 13px; line-height: 20px; user-select: none; overflow: hidden; background: var(--input); min-width: 44px; white-space: pre; font-family: var(--mono); }
  /* Editor: a transparent textarea over a highlighted copy (pre.hl); both must have identical text metrics. */
  .code-wrap { position: relative; flex: 1; min-width: 0; background: var(--input); }
  .code-wrap .code { position: absolute; inset: 0; margin: 0; border: 0; padding: 10px 12px; font: 13px/20px var(--mono); letter-spacing: 0; white-space: pre; tab-size: 2; }
  pre.hl { overflow: hidden; pointer-events: none; color: var(--t-text); }
  pre.hl span { font-style: normal; font-weight: normal; } /* no italics or bold: the text under the cursor must not shift */
  textarea.code { resize: none; outline: none; overflow: auto; background: transparent; color: transparent; caret-color: var(--accent-strong); }
  textarea.code::selection { background: var(--selection); color: transparent; }
  pre.view { margin: 0; padding: 12px 16px; font-size: 13px; line-height: 20px; white-space: pre; overflow: auto; color: var(--t-text); }
  pre.view.solution { background: var(--code); border: 1px solid var(--line); border-radius: 12px; }

  .results { padding: 18px 26px 44px; max-width: 920px; }
  .results h3 { font-size: 15px; margin: 20px 0 6px; font-family: var(--mono); color: var(--text); display: flex; gap: 10px; align-items: baseline; }
  .results h3 small { font: 700 10.5px/1.4 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--eyebrow); }
  .test { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .test .ic { width: 18px; flex: none; text-align: center; font-weight: 700; }
  .test.pass .ic { color: var(--ok); } .test.fail .ic { color: var(--err); } .test.skip .ic { color: var(--muted); }
  .test.parent { font-weight: 700; border-bottom: 0; padding-top: 12px; }
  .test .body { flex: 1; min-width: 0; }
  .test pre { margin: 6px 0 2px; background: var(--err-bg); padding: 8px 12px; border-radius: 10px; font-size: 12.5px; white-space: pre-wrap; overflow-x: auto; font-weight: 400; }
  .test pre .add { color: var(--err); font-weight: 700; } .test pre .del { color: var(--ok); font-weight: 700; }
  .test .skipmsg { color: var(--muted); font-size: 13px; }
  .legend { font-size: 13.5px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--link); margin-top: 6px; }

  .resizer { height: 5px; cursor: row-resize; background: var(--nav); border-top: 1px solid var(--line); flex: none; }
  .term { flex: none; height: 36vh; background: var(--term-bg); color: var(--term-text); font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; min-height: 80px; }
  .term-bar { display: flex; align-items: center; gap: 10px; padding: 4px 12px; color: var(--eyebrow); font: 700 10.5px/1.4 var(--sans); letter-spacing: .14em; text-transform: uppercase; border-bottom: 1px solid var(--term-line); }
  .term-bar button { background: transparent; color: var(--term-text); border-color: var(--term-line); padding: 2px 11px; font: 400 12px/1.4 var(--sans); letter-spacing: 0; text-transform: none; }
  .term-out { flex: 1; overflow-y: auto; padding: 8px 14px 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .term-line { display: flex; gap: 8px; padding: 2px 14px 10px; }
  .term-line .p { color: var(--term-prompt); white-space: nowrap; }
  .term-line input { flex: 1; background: transparent; border: 0; outline: none; color: var(--term-text); font: inherit; caret-color: var(--accent-strong); min-width: 0; }
  .term .cmd { color: var(--term-cmd); font-weight: 600; } .term .cmd .p { color: var(--term-prompt); }
  .term .info { color: var(--term-info); } .term .muted { color: var(--term-muted); }
  .a1 { font-weight: 700; } .a2 { opacity: .7; } .a3 { font-style: italic; }
  .a30 { color: var(--ansi-30); } .a31 { color: var(--ansi-31); } .a32 { color: var(--ansi-32); } .a33 { color: var(--ansi-33); }
  .a34 { color: var(--ansi-34); } .a35 { color: var(--ansi-35); } .a36 { color: var(--ansi-36); } .a37 { color: var(--ansi-37); }
  .a90 { color: var(--ansi-90); } .a91 { color: var(--ansi-91); } .a92 { color: var(--ansi-92); } .a93 { color: var(--ansi-93); }
  .a94 { color: var(--ansi-94); } .a95 { color: var(--ansi-95); } .a96 { color: var(--ansi-96); } .a97 { color: var(--ansi-97); }

  /* Syntax colours (highlight.mjs) in the site palette */
  .t-kw { color: var(--t-kw); font-weight: 700; } .t-lit { color: var(--t-lit); } .t-str { color: var(--t-str); } .t-num { color: var(--t-num); }
  .t-com { color: var(--t-com); font-style: italic; } .t-title { color: var(--t-title); font-weight: 700; } .t-bi { color: var(--t-bi); }
  .t-var { color: var(--t-var); } .t-subst { color: var(--t-subst); } .t-type { color: var(--t-type); } .t-attr { color: var(--t-attr); }

  .modal { position: fixed; inset: 0; background: rgba(36, 22, 38, .5); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .modal.open { display: flex; }
  .modal .box { background: var(--bg); border-radius: 16px; width: min(960px, 100%); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(36, 22, 38, .3); }
  .modal .box-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  .modal .box-head b { flex: 1; font-family: var(--mono); font-size: 13px; font-weight: 400; }
  .modal .box-body { overflow: auto; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    header { grid-column: 1; flex-wrap: wrap; padding: 8px 16px; gap: 8px; }
    nav { max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .where { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="ui/logo.svg" alt="">
    <h1>Lern-Cockpit <span>· Planeten &amp; Erdbeben</span></h1>
    <div class="seg" id="filter">
      <button data-f="alle">Alle</button><button data-f="fiae">FIAE</button><button data-f="fisi">FISI</button>
    </div>
    <div class="spacer"></div>
    <div class="where" id="where"></div>
  </header>
  <nav id="nav"></nav>
  <div class="main">
    <div id="unitHead"></div>
    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"></div>
    <div class="resizer" id="resizer" title="Ziehen, um das Terminal größer oder kleiner zu machen"></div>
    <div class="term" id="term">
      <div class="term-bar">
        <span>Terminal</span><span id="termState"></span><span class="spacer"></span>
        <button id="termStop" disabled>Abbrechen (Strg+C)</button>
        <button id="termClear">Leeren</button>
      </div>
      <div class="term-out" id="termOut"></div>
      <div class="term-line"><span class="p" id="termPrompt">meine-uebungen $</span><input id="termIn" autocomplete="off" spellcheck="false" aria-label="Befehl eingeben"></div>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="box"><div class="box-head"><b id="modalTitle"></b><button id="modalClose">Schließen</button></div><div class="box-body" id="modalBody"></div></div></div>

<script type="module" src="ui/app.mjs"></script>
</body>
</html>
